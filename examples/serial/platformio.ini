; IOP Serial example — bare-metal UART, no framework dependency.
; AVR:    Timer0 tick + USART0 (D0/D1 on Uno)
; STM32:  SysTick + USART1 (PA9/PA10 on Blue Pill) — PLL to 72 MHz from HSE crystal
[platformio]
default_envs = avr

[common]
build_unflags =
    -std=c++11 -std=c++14 -std=c++20 -std=c++2a
    -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++1z
build_flags = -std=c++17
; Local source tree, not GitHub -- matches every other example in this
; repo (lib_extra_dirs = ../../..), so in-tree library fixes are actually
; picked up instead of a stale published copy.
lib_extra_dirs = ../../..

[env:avr]
platform = atmelavr@^4.0.0
board = uno
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 9600
build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP
lib_extra_dirs = ${common.lib_extra_dirs}

[env:bluepill_iop]
platform  = ststm32
board     = bluepill_f103c8
framework = cmsis
upload_protocol = stlink
debug_tool      = stlink

build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP -DSTM32F1xx
lib_extra_dirs = ${common.lib_extra_dirs}
